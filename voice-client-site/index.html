<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rewired</title>
<meta name="description" content="Rewired — Your AI Swarm, Anywhere.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'JetBrains Mono',monospace;
  background:#080808;color:#a0a0a8;overflow:hidden;
  height:100vh;width:100vw;
  -webkit-font-smoothing:antialiased
}
::selection{background:#ff003c;color:#fff}

/* ── Canvas BG ── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── Scanlines ── */
.scanlines{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,0,60,0.015) 2px,rgba(255,0,60,0.015) 4px)
}

/* ── Noise ── */
.noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:256px 256px
}

/* ── Glow orbs ── */
.glow{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(120px)
}
.glow.g1{width:600px;height:600px;top:-20%;left:-15%;background:radial-gradient(circle,rgba(255,0,60,0.15),transparent 70%)}
.glow.g2{width:400px;height:400px;bottom:-15%;right:-10%;background:radial-gradient(circle,rgba(0,255,255,0.08),transparent 70%)}

/* ── Center content ── */
.center{
  position:fixed;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:0
}

/* ── Terminal text ── */
.terminal-line{
  font-size:clamp(48px,10vw,110px);font-weight:800;
  color:#fff;letter-spacing:-0.04em;line-height:1;margin-bottom:12px;
  position:relative;display:inline-block
}
.terminal-line .cursor{
  display:inline-block;width:0.08em;height:0.85em;
  background:#ff003c;margin-left:4px;
  animation:blink 1s step-end infinite;vertical-align:middle
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Sub-line (tagline typewriter) ── */
.tagline{
  font-size:clamp(13px,1.8vw,16px);color:rgba(255,255,255,0.3);
  font-weight:400;letter-spacing:0.02em;margin-bottom:48px;
  min-height:1.4em;font-family:'JetBrains Mono',monospace
}
.tagline .cursor-sm{
  display:inline-block;width:0.5em;height:1em;
  background:rgba(255,0,60,0.5);margin-left:2px;
  animation:blink 1s step-end infinite;vertical-align:text-bottom
}

/* ── #12: Fun 3D Button ── */
.actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.pushable{
  position:relative;border:none;background:transparent;padding:0;
  cursor:pointer;outline-offset:4px;transition:filter 0.2s;
  font-family:'JetBrains Mono',monospace;text-decoration:none;display:inline-flex
}
.pushable:hover{filter:brightness(1.15)}
.pushable .shadow{
  position:absolute;inset:0;border-radius:8px;transition:all 0.2s
}
.pushable .shadow{background:rgba(255,0,60,0.3);filter:blur(10px);transform:translateY(3px)}
.pushable:hover .shadow{transform:translateY(6px);filter:blur(16px);background:rgba(255,0,60,0.45)}
.pushable .edge{
  position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(to left,rgba(200,0,48,1),rgba(140,0,34,1))
}
.pushable .front{
  display:block;position:relative;padding:14px 32px;
  border-radius:8px;font-size:14px;font-weight:700;letter-spacing:0.03em;
  background:linear-gradient(135deg,#ff003c,#cc0030);
  color:#fff;transform:translateY(-4px);
  transition:transform 0.15s ease,box-shadow 0.15s ease;
  will-change:transform;white-space:nowrap
}
.pushable:active .front{transform:translateY(-1px)}

.pushable.secondary .edge{background:linear-gradient(to left,rgba(255,255,255,0.08),rgba(255,255,255,0.03))}
.pushable.secondary .shadow{background:rgba(255,255,255,0.04)}
.pushable.secondary .front{
  background:rgba(255,255,255,0.02);
  color:rgba(255,255,255,0.55);
  border:1px solid rgba(255,255,255,0.06);
  backdrop-filter:blur(12px)
}
.pushable.secondary:hover .front{border-color:rgba(255,255,255,0.15);color:#fff}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="scanlines"></div>
<div class="noise"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="center">
  <div class="terminal-line" id="mainText">
    <span id="mainLabel"></span><span class="cursor"></span>
  </div>
  <div class="tagline" id="tagline">
    <span id="taglineLabel"></span><span class="cursor-sm"></span>
  </div>
  <div class="actions" id="buttons" style="opacity:0">
    <a href="/downloads" class="pushable">
      <span class="shadow"></span>
      <span class="edge"></span>
      <span class="front">_download</span>
    </a>
    <a href="https://github.com/Goncalo-Oliveira-Goncalves/rewired-agent#readme" target="_blank" class="pushable secondary">
      <span class="shadow"></span>
      <span class="edge"></span>
      <span class="front">_read_the_docs</span>
    </a>
  </div>
</div>

<script>
// ── BG Canvas: Matrix-like particles ──
(function(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let particles = [], cols;

  function resize(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    cols = Math.floor(c.width / 14);
  }
  window.addEventListener('resize', resize);
  resize();

  // Falling binary/glyph drops
  const glyphs = '01rewired01rewired01rewired01rewired01rewired';
  const drops = [];
  for(let i = 0; i < cols; i++){
    drops[i] = {y: Math.random() * c.height, speed: 0.3 + Math.random() * 0.5, len: 5 + Math.random() * 15};
  }

  function drawMatrix(){
    ctx.fillStyle = 'rgba(8,8,8,0.05)';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.font = '10px "JetBrains Mono", monospace';

    for(let i = 0; i < cols; i++){
      const d = drops[i];
      const x = i * 14;
      for(let j = 0; j < d.len; j++){
        const y = d.y - j * 14;
        if(y < 0 || y > c.height) continue;
        const char = glyphs[Math.floor(Math.random() * glyphs.length)];
        const alpha = 1 - (j / d.len);
        const isHead = j === 0;
        ctx.fillStyle = isHead ? `rgba(255,0,60,${alpha * 0.7})` : `rgba(255,0,60,${alpha * 0.15})`;
        ctx.fillText(char, x, y);
      }
      d.y += d.speed;
      if(d.y - d.len * 14 > c.height){
        d.y = 0;
        d.len = 5 + Math.random() * 15;
        d.speed = 0.3 + Math.random() * 0.5;
      }
    }
    requestAnimationFrame(drawMatrix);
  }
  drawMatrix();
})();

// ── Terminal typewriter ──
const mainText = "rewired";
const taglines = [
  "your ai swarm, anywhere.",
  "autonomous agents. your infra.",
  "voice-enabled. multi-platform.",
  "run $ rewired setup"
];
let ti = 0, tj = 0, tk = 0, tli = 0;
const mainEl = document.getElementById('mainLabel');
const tagEl = document.getElementById('taglineLabel');
const btns = document.getElementById('buttons');

function typeMain(){
  if(ti < mainText.length){
    mainEl.textContent += mainText[ti];
    ti++;
    setTimeout(typeMain, 80 + Math.random() * 60);
  } else {
    setTimeout(typeTagline, 400);
  }
}

function typeTagline(){
  const line = taglines[tli];
  if(tj < line.length){
    tagEl.textContent += line[tj];
    tj++;
    setTimeout(typeTagline, 30 + Math.random() * 40);
  } else {
    setTimeout(() => {
      tagEl.textContent = '';
      tj = 0;
      tli = (tli + 1) % taglines.length;
      typeTagline();
    }, 2500);
  }
}

// Show buttons after first tagline finishes
setTimeout(() => {
  btns.style.transition = 'opacity 0.8s ease';
  btns.style.opacity = '1';
}, 2500);

typeMain();
</script>

</body>
</html>
